name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Vérifier les fichiers indispensables
        run: |
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/fixed.keystore app/src/main/AndroidManifest.xml; do
            test -f "$f" || { echo "::error::Fichier manquant dans le dépôt : $f (vérifie le .gitignore)"; exit 1; }
          done

      - name: Vérifier les liens du catalogue de modèles
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request
          for m in json.load(open('app/src/main/assets/catalog.json')):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(m['url'], method='HEAD'), timeout=30)
                  print('OK ', r.status, m['id'])
              except Exception as e:
                  print('::warning::Lien cassé pour', m['id'], e)
          PYEOF

      - name: Installer plateforme, NDK et CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK Android : $SDK"
          SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1 || true)
          if [ -z "$SM" ]; then SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n1); fi
          echo "sdkmanager : $SM"
          test -n "$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
          echo "NDK=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # Cache restauré ici, sauvegardé seulement si les deux moteurs sont bien compilés
      - name: Restaurer le cache des moteurs natifs
        id: native
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/jniLibs
          key: native-v4-moteurs

      - name: Compiler llama.cpp (serveur de chat) pour Android arm64
        if: steps.native.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B build-llama \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON
          cmake --build build-llama --target llama-server -j4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build-llama/bin/llama-server app/src/main/jniLibs/arm64-v8a/libllama_server.so

      - name: Compiler stable-diffusion.cpp (génération d'images) pour Android arm64
        if: steps.native.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp
          cmake -S stable-diffusion.cpp -B build-sd \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DSD_BUILD_EXAMPLES=ON
          cmake --build build-sd -j4
          BIN=$(find build-sd -type f \( -name sd-cli -o -name sd \) -perm -u+x | head -n1)
          echo "Binaire sd : $BIN"
          test -n "$BIN"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libsd.so

      - name: Ajouter proot (conteneur Linux léger, optionnel)
        if: steps.native.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          BASE=https://packages.termux.dev/apt/termux-main
          curl -fsSL $BASE/dists/stable/main/binary-aarch64/Packages -o Packages
          FILE=$(awk '/^Package: proot$/{f=1} f&&/^Filename:/{print $2; exit}' Packages)
          curl -fsSL $BASE/$FILE -o proot.deb
          mkdir proot-x && cd proot-x && ar x ../proot.deb && tar xf data.tar.*
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp data/data/com.termux/files/usr/bin/proot ../app/src/main/jniLibs/arm64-v8a/libproot.so

      - name: Résumé des moteurs natifs
        id: engines
        run: |
          D=app/src/main/jniLibs/arm64-v8a
          ls -la "$D" 2>/dev/null || true
          if [ -f "$D/libllama_server.so" ] && [ -f "$D/libsd.so" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Un moteur natif manque : l'APK sera compilé quand même, mais sans ce moteur."
          fi

      - name: Sauvegarder le cache des moteurs natifs
        if: steps.native.outputs.cache-hit != 'true' && steps.engines.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/jniLibs
          key: native-v4-moteurs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compiler l'APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Envoyer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Studo-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Envoyer les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-build
          path: |
            app/build/reports
            build-llama/CMakeFiles/CMakeError.log
            build-sd/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
